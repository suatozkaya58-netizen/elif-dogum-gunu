<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Elif'in Dağdaki Yazıtı</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Manrope:wght@400;600&display=swap">
<style>
  /* Yerleşim: tam ekran tuval sahnesi. Sabah gökyüzü, yeşil dağ, orman ve sis bir kez offscreen çizilir; yazıt, işçi, toz, kuşlar ve uçurtmalar her karede üstüne biner. DOM yalnızca giriş, altyazı ve kapanış için. Tek görünüm: sabah ışığı. */
  :root {
    color-scheme: light;
    --gok: #bfe0f2;
    --cim: #4f8a3c;
    --orman: #1f4a2c;
    --tas: #b9b2a4;
    --metin: #22331f;
    --metin-soluk: #5d6b57;
    --kagit: #fffdf7;
    --yazit: "Cinzel", "Palatino Linotype", Georgia, serif;
    --govde: "Manrope", "Segoe UI", system-ui, sans-serif;
  }

  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--gok);
    color: var(--metin);
    font-family: var(--govde);
    font-size: 17px;
    line-height: 1.5;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  *, *::before, *::after { box-sizing: border-box; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }
  button:focus-visible { outline: 2px solid var(--orman); outline-offset: 5px; }

  #sahne { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }

  .katman {
    position: fixed; z-index: 2; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; text-align: center;
    padding-block: calc(24px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  /* Giriş */
  #giris { background: rgba(255, 253, 247, 0.5); backdrop-filter: blur(1px); }
  .ustyazi {
    margin: 0; font-size: 13px; letter-spacing: 0.34em;
    color: var(--metin-soluk);
  }
  #giris h1 {
    margin: 0; font-family: var(--yazit); font-weight: 500;
    font-size: clamp(30px, 7.4vw, 52px); letter-spacing: 0.06em; line-height: 1.15;
    text-wrap: balance; color: #1b2e18;
  }
  .dugme {
    font-family: var(--govde); font-weight: 600; font-size: 14px;
    letter-spacing: 0.22em;
    padding: 13px 30px; border-radius: 2px;
    border: 1px solid rgba(31, 74, 44, 0.5);
    color: #1b2e18; background: rgba(255, 253, 247, 0.55);
    transition: background-color 0.25s, border-color 0.25s;
  }
  .dugme:hover { background: rgba(255, 253, 247, 0.9); border-color: rgba(31, 74, 44, 0.85); }

  /* Altyazı */
  #altyazi {
    position: fixed; z-index: 2; left: 0; right: 0;
    bottom: calc(5.5% + env(safe-area-inset-bottom, 0px));
    padding-left: max(24px, env(safe-area-inset-left, 0px));
    padding-right: max(24px, env(safe-area-inset-right, 0px));
    margin: 0; text-align: center; text-wrap: balance;
    font-size: clamp(15px, 3.9vw, 20px); letter-spacing: 0.02em; font-weight: 600;
    color: var(--kagit);
    text-shadow: 0 1px 10px rgba(16, 38, 18, 0.85), 0 0 2px rgba(16, 38, 18, 0.6);
    opacity: 0; transition: opacity 0.7s ease;
  }
  #altyazi.gorunur { opacity: 1; }

  /* Kapanış */
  #kapanis { justify-content: flex-start; gap: 14px; pointer-events: none; }
  #kapanis > * { pointer-events: auto; }
  #kapanis .ustyazi { color: #3d5137; animation: yumusak 1.6s 0.2s ease-out backwards; }
  .tebrik {
    margin: 0; font-family: var(--yazit); font-weight: 500;
    font-size: clamp(26px, 6.4vw, 42px); letter-spacing: 0.05em; line-height: 1.2;
    text-wrap: balance; color: #1b2e18;
    text-shadow: 0 1px 12px rgba(255, 253, 247, 0.85);
    animation: yumusak 1.8s 0.6s ease-out backwards;
  }
  #kapanis .dugme { margin-top: 6px; animation: yumusak 1.6s 2.4s ease-out backwards; }

  .ses-dugme {
    position: fixed; z-index: 3;
    top: calc(14px + env(safe-area-inset-top, 0px));
    right: calc(16px + env(safe-area-inset-right, 0px));
    font-size: 11px; letter-spacing: 0.18em;
    color: #3f5139; padding: 6px 4px;
  }
  .ses-dugme:hover { color: #16280f; }

  @keyframes yumusak { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    #kapanis .ustyazi, .tebrik, #kapanis .dugme { animation: none; }
    #altyazi { transition: none; }
  }
</style>

<canvas id="sahne" aria-hidden="true"></canvas>
<button class="ses-dugme" id="sesDugme" type="button" aria-pressed="true">SES AÇIK</button>

<p id="altyazi" aria-live="polite"></p>

<section class="katman" id="giris">
  <p class="ustyazi">ELİF İÇİN</p>
  <h1>Dağdaki Yazıt</h1>
  <button class="dugme" id="basla" type="button">BAŞLAT</button>
</section>

<section class="katman" id="kapanis" hidden>
  <p class="ustyazi">14 KASIM</p>
  <p class="tebrik">İyi ki doğdun, Elif</p>
  <button class="dugme" id="tekrar" type="button">TEKRAR İZLE</button>
</section>

<script>
(function () {
  'use strict';

  var ISIM = 'ELİF';
  var SATIRLAR = [ISIM, 'DOĞUM GÜNÜN', 'KUTLU OLSUN'];
  var YAZIT_TIPI = '"Cinzel", "Palatino Linotype", Georgia, serif';
  var sec = function (id) { return document.getElementById(id); };
  var rast = function (a, b) { return a + Math.random() * (b - a); };
  var azHareket = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- Gürültü ----------
  var tohum = 2024;
  function karma(x, y) { var n = Math.sin(x * 127.1 + y * 311.7 + tohum) * 43758.5453; return n - Math.floor(n); }
  function yumusat(t) { return t * t * (3 - 2 * t); }
  function gurultu(x, y) {
    var x0 = Math.floor(x), y0 = Math.floor(y), fx = yumusat(x - x0), fy = yumusat(y - y0);
    var a = karma(x0, y0), b = karma(x0 + 1, y0), c = karma(x0, y0 + 1), d = karma(x0 + 1, y0 + 1);
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  }
  function fbm(x, y, katman) {
    var toplam = 0, genlik = 0.5, olcek = 1;
    for (var i = 0; i < (katman || 4); i++) { toplam += gurultu(x * olcek, y * olcek) * genlik; olcek *= 2.07; genlik *= 0.5; }
    return toplam;
  }

  // ---------- Ses ----------
  var ses = null, ana = null, sesAcik = true, gurultuTampon = null, ruzgar = null;
  function sesHazirla() {
    if (ses) { if (ses.state === 'suspended') ses.resume(); return; }
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      ses = new AC();
      ana = ses.createGain();
      ana.gain.value = sesAcik ? 0.55 : 0;
      ana.connect(ses.destination);
      var uzunluk = Math.floor(ses.sampleRate * 2);
      gurultuTampon = ses.createBuffer(1, uzunluk, ses.sampleRate);
      var veri = gurultuTampon.getChannelData(0);
      for (var i = 0; i < uzunluk; i++) veri[i] = Math.random() * 2 - 1;
    } catch (e) { ses = null; }
  }
  function ruzgarBaslat() {
    if (!ses || ruzgar) return;
    var k = ses.createBufferSource(); k.buffer = gurultuTampon; k.loop = true;
    var f = ses.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420; f.Q.value = 0.6;
    var g = ses.createGain(); g.gain.value = 0.05;
    k.connect(f); f.connect(g); g.connect(ana);
    k.start();
    ruzgar = { kaynak: k, kazanc: g };
  }
  function gurultuSes(gecikme, sure, frekans, Q, siddet, tip) {
    if (!ses) return;
    var t = ses.currentTime + (gecikme || 0);
    var k = ses.createBufferSource(); k.buffer = gurultuTampon;
    var f = ses.createBiquadFilter(); f.type = tip || 'bandpass'; f.frequency.value = frekans; f.Q.value = Q || 1;
    var g = ses.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(siddet, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + sure);
    k.connect(f); f.connect(g); g.connect(ana);
    k.start(t); k.stop(t + sure + 0.05);
  }
  function tonSes(frekans, gecikme, sure, siddet, tip, bitis) {
    if (!ses) return;
    var t = ses.currentTime + (gecikme || 0);
    var o = ses.createOscillator(), g = ses.createGain();
    o.type = tip || 'sine';
    o.frequency.setValueAtTime(frekans, t);
    if (bitis) o.frequency.exponentialRampToValueAtTime(bitis, t + sure);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(siddet, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + sure);
    o.connect(g); g.connect(ana);
    o.start(t); o.stop(t + sure + 0.05);
  }
  function cekicSesi() {
    gurultuSes(0, 0.08, 2800, 5, 0.15);
    gurultuSes(0.004, 0.2, 480, 1.3, 0.09);
    tonSes(205, 0, 0.14, 0.09, 'triangle', 95);
  }
  function tasKirik() { gurultuSes(0, 0.35, 1100, 0.9, 0.06); }
  function kusOtmesi(gecikme) {
    var temel = rast(2100, 3200);
    tonSes(temel, gecikme, 0.07, 0.05, 'sine', temel * rast(1.2, 1.7));
    tonSes(temel * 1.1, gecikme + 0.1, 0.06, 0.04, 'sine', temel * 0.8);
    if (Math.random() < 0.5) tonSes(temel * 1.2, gecikme + 0.2, 0.05, 0.03, 'sine', temel * 1.4);
  }
  function muzikNota(frekans, gecikme, siddet) {
    tonSes(frekans, gecikme, 1.5, siddet || 0.14, 'sine');
    tonSes(frekans * 2.01, gecikme, 0.7, (siddet || 0.14) * 0.3, 'sine');
  }
  function ezgiCal(basla) {
    var G = 392, A = 440, B = 493.88, C = 523.25, D = 587.33, E = 659.25, F = 698.46, G5 = 783.99;
    var ezgi = [[G, .75], [G, .25], [A, 1], [G, 1], [C, 1], [B, 2],
                [G, .75], [G, .25], [A, 1], [G, 1], [D, 1], [C, 2],
                [G, .75], [G, .25], [G5, 1], [E, 1], [C, 1], [B, 1], [A, 2],
                [F, .75], [F, .25], [E, 1], [C, 1], [D, 1], [C, 3]];
    var vurus = 0.46, t = basla || 0.6;
    ezgi.forEach(function (n) { muzikNota(n[0] * 2, t, 0.12); t += n[1] * vurus; });
  }
  sec('sesDugme').addEventListener('click', function () {
    sesAcik = !sesAcik;
    this.textContent = sesAcik ? 'SES AÇIK' : 'SES KAPALI';
    this.setAttribute('aria-pressed', String(sesAcik));
    sesHazirla();
    if (ana) ana.gain.value = sesAcik ? 0.55 : 0;
  });

  // ---------- Tuval ----------
  var tuval = sec('sahne'), ekran = tuval.getContext('2d');
  var gen = 0, yuk = 0, dpr = 1;
  var arka = document.createElement('canvas'), arkaCtx = arka.getContext('2d');
  var yazitKat = document.createElement('canvas'), yazitCtx = yazitKat.getContext('2d');
  var parcalar = [], kuslar = [], ucurtmalar = [], yapraklar = [];
  var zirve = { x: 0, y: 0, taban: 0 };
  var gunesX = 0, gunesY = 0, gunesR = 0;
  var yazitAlani = null;

  function olcuHesapla() {
    zirve.x = gen * 0.52; zirve.y = yuk * 0.3; zirve.taban = Math.max(gen * 0.95, yuk * 1.1);
    gunesR = Math.min(gen, yuk) * 0.045;
    gunesX = gen * 0.19; gunesY = yuk * 0.17;
  }
  function dagHat(x) {
    var t = Math.abs(x - zirve.x) / zirve.taban;
    if (t >= 1) return yuk + 10;
    var temel = zirve.y + (yuk - zirve.y) * Math.pow(t, 0.86);
    var puruz = (fbm(x * 0.0055, 4.2, 4) - 0.48) * (yuk - zirve.y) * 0.24 * (0.18 + t);
    var sirt = (fbm(x * 0.031, 9.1, 3) - 0.5) * (yuk - zirve.y) * 0.09 * (0.2 + t);
    var catlak = (fbm(x * 0.06, 21.4, 2) - 0.5) * 6;
    return temel + puruz + sirt + catlak;
  }
  function dagGenisligi(y) {
    var t = Math.pow(Math.max(0, (y - zirve.y)) / Math.max(1, yuk - zirve.y), 1 / 0.86);
    return 2 * zirve.taban * t;
  }
  function sonluMu(d) { return typeof d === 'number' && isFinite(d); }

  // ---------- Yazıt yerleşimi ----------
  var glifler = [], harfAraligi = 0.1;
  function yazitYerlesim() {
    var yOran = [0.57, 0.705, 0.835], tavan = [0.078, 0.053, 0.053];
    var eski = glifler.map(function (g) { return g.kazili; });
    glifler = [];
    var solSinir = Infinity, sagSinir = -Infinity, ustSinir = Infinity, altSinir = -Infinity;
    SATIRLAR.forEach(function (metin, i) {
      var y = yuk * yOran[i];
      var enGenis = Math.min(dagGenisligi(y) * 0.5, gen * 0.82);
      ekran.font = '700 100px ' + YAZIT_TIPI;
      var harfSay = Array.from(metin).length;
      var olculen = ekran.measureText(metin).width + 100 * harfAraligi * (harfSay - 1);
      var boyut = olculen > 0 ? Math.min(100 * enGenis / olculen, yuk * tavan[i]) : yuk * tavan[i];
      if (!sonluMu(boyut) || boyut <= 0) boyut = yuk * tavan[i];
      ekran.font = '700 ' + boyut + 'px ' + YAZIT_TIPI;
      var aralik = boyut * harfAraligi;
      var toplam = ekran.measureText(metin).width + aralik * (harfSay - 1);
      var x = gen / 2 - toplam / 2;
      solSinir = Math.min(solSinir, x); sagSinir = Math.max(sagSinir, x + toplam);
      ustSinir = Math.min(ustSinir, y - boyut * 0.6); altSinir = Math.max(altSinir, y + boyut * 0.6);
      Array.from(metin).forEach(function (ch) {
        var gw = ekran.measureText(ch).width;
        if (ch !== ' ') glifler.push({ ch: ch, x: x + gw / 2, y: y, boyut: boyut, satir: i, kazili: false });
        x += gw + aralik;
      });
    });
    glifler.forEach(function (g, i) { g.kazili = !!eski[i]; });
    yazitAlani = (sonluMu(solSinir) && sonluMu(sagSinir) && sonluMu(ustSinir) && sonluMu(altSinir) && sagSinir > solSinir)
      ? { x0: solSinir, x1: sagSinir, y0: ustSinir, y1: altSinir } : null;
  }
  function yazitKatHazirla() {
    yazitKat.width = gen * dpr; yazitKat.height = yuk * dpr;
    yazitCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    yazitCtx.clearRect(0, 0, gen, yuk);
    glifler.forEach(function (g) { if (g.kazili) glifKaz(g); });
  }
  function glifKaz(g) {
    var c = yazitCtx, d = Math.max(1.3, g.boyut * 0.05);
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = '700 ' + g.boyut + 'px ' + YAZIT_TIPI;
    // Güneş sol üstte: oyuğun sağ-alt kenarı aydınlık, sol-üst kenarı gölgeli
    c.fillStyle = 'rgba(255, 252, 240, 0.8)';
    c.fillText(g.ch, g.x + d * 0.55, g.y + d * 0.75);
    c.fillStyle = 'rgba(48, 40, 28, 0.55)';
    c.fillText(g.ch, g.x - d * 0.5, g.y - d * 0.65);
    c.fillStyle = 'rgba(86, 78, 62, 0.88)';
    c.fillText(g.ch, g.x, g.y);
    c.strokeStyle = 'rgba(38, 32, 22, 0.35)';
    c.lineWidth = Math.max(0.8, d * 0.3);
    c.strokeText(g.ch, g.x, g.y);
    g.kazili = true;
  }

  // ---------- Arka plan ----------
  function arkaPlanCiz() {
    var c = arkaCtx, i, x, y;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, gen, yuk);

    // Sabah gökyüzü
    var gok = c.createLinearGradient(0, 0, 0, yuk * 0.62);
    gok.addColorStop(0, '#7db7dd');
    gok.addColorStop(0.42, '#b6dcef');
    gok.addColorStop(0.72, '#ecdcc0');
    gok.addColorStop(1, '#f7cfa4');
    c.fillStyle = gok; c.fillRect(0, 0, gen, yuk);

    // Güneş ve halesi
    var hale = c.createRadialGradient(gunesX, gunesY, gunesR * 0.6, gunesX, gunesY, gunesR * 11);
    hale.addColorStop(0, 'rgba(255, 244, 206, 0.85)');
    hale.addColorStop(0.18, 'rgba(255, 230, 170, 0.33)');
    hale.addColorStop(0.55, 'rgba(255, 221, 170, 0.1)');
    hale.addColorStop(1, 'rgba(255, 221, 170, 0)');
    c.fillStyle = hale; c.beginPath(); c.arc(gunesX, gunesY, gunesR * 11, 0, 6.283); c.fill();
    c.fillStyle = '#fffdf2';
    c.beginPath(); c.arc(gunesX, gunesY, gunesR, 0, 6.283); c.fill();

    // İnce sabah bulutları
    for (i = 0; i < 11; i++) {
      var bx = rast(-gen * 0.1, gen * 1.1), by = rast(yuk * 0.05, yuk * 0.42);
      var bw = rast(gen * 0.14, gen * 0.44), bh = rast(yuk * 0.008, yuk * 0.022);
      var bul = c.createLinearGradient(bx, by, bx + bw, by);
      var a = rast(0.16, 0.42);
      bul.addColorStop(0, 'rgba(255, 252, 245, 0)');
      bul.addColorStop(0.5, 'rgba(255, 252, 245, ' + a.toFixed(2) + ')');
      bul.addColorStop(1, 'rgba(255, 252, 245, 0)');
      c.fillStyle = bul;
      c.beginPath(); c.ellipse(bx + bw / 2, by, bw / 2, bh, 0, 0, 6.283); c.fill();
    }

    // Uzak sıradağlar: hava perspektifiyle soluk mavi
    [[0.53, 'rgba(146, 176, 190, 0.78)', 0.0045, 0.058], [0.585, 'rgba(118, 152, 150, 0.8)', 0.0032, 0.085]].forEach(function (kat) {
      var taban = yuk * kat[0];
      c.fillStyle = kat[1];
      c.beginPath(); c.moveTo(0, yuk);
      for (x = 0; x <= gen; x += 4) c.lineTo(x, taban - (fbm(x * kat[2], 17.3, 4) - 0.35) * yuk * kat[3] * 3.4);
      c.lineTo(gen, yuk); c.closePath(); c.fill();
    });

    // Ana dağ gövdesi
    var yol = new Path2D();
    yol.moveTo(zirve.x - zirve.taban, yuk + 10);
    for (x = Math.max(-20, zirve.x - zirve.taban); x <= Math.min(gen + 20, zirve.x + zirve.taban); x += 3) yol.lineTo(x, dagHat(x));
    yol.lineTo(zirve.x + zirve.taban, yuk + 10);
    yol.closePath();

    var cimBoya = c.createLinearGradient(gen * 0.15, zirve.y, gen * 0.9, yuk);
    cimBoya.addColorStop(0, '#6f9a52');
    cimBoya.addColorStop(0.3, '#4e8440');
    cimBoya.addColorStop(0.72, '#3a6d35');
    cimBoya.addColorStop(1, '#2c5a2c');
    c.fillStyle = cimBoya; c.fill(yol);

    c.save();
    c.clip(yol);

    // Kayalık zirve
    var kayaSinir = zirve.y + (yuk - zirve.y) * 0.17;
    c.beginPath();
    c.moveTo(zirve.x - zirve.taban, zirve.y - 40);
    for (x = Math.max(-20, zirve.x - zirve.taban); x <= Math.min(gen + 20, zirve.x + zirve.taban); x += 3) c.lineTo(x, dagHat(x) - 1);
    for (x = Math.min(gen + 20, zirve.x + zirve.taban); x >= Math.max(-20, zirve.x - zirve.taban); x -= 5) {
      var alt = dagHat(x) + (kayaSinir - dagHat(x)) * (0.25 + fbm(x * 0.014, 31.7, 3) * 1.6);
      c.lineTo(x, Math.max(dagHat(x), alt));
    }
    c.closePath();
    var kayaBoya = c.createLinearGradient(gen * 0.3, zirve.y, gen * 0.8, kayaSinir * 1.3);
    kayaBoya.addColorStop(0, '#c3bba8');
    kayaBoya.addColorStop(0.6, '#9e9583');
    kayaBoya.addColorStop(1, '#7d7768');
    c.fillStyle = kayaBoya; c.fill();

    // Zirvede birkaç kar lekesi
    for (i = 0; i < 18; i++) {
      x = rast(zirve.x - zirve.taban * 0.13, zirve.x + zirve.taban * 0.13);

  // ---------- Kazıma ----------

  function kazimaBaslat() {

    glifler.forEach(function (g) { g.kazili = false; });

  function kazimaAdim(dt) {
    if (!kazimaAcik) return;

    tasKirik();
    tozKivilcim(g.x, g.y + g.boyut * 0.1, 13);
    kaziliSayi++;
    if (kaziliSayi >= glifler.length) { kazimaAcik = false; isci.vuruyor = false; bitir(); return; }
    isciyiYerlestir();
  }

  // ---------- Kare döngüsü ----------
  function kare(zaman) {
    var dt = onceki ? Math.min(0.5, (zaman - onceki) / 1000) : 0.016;
    onceki = zaman;
    ekran.clearRect(0, 0, gen, yuk);
    ekran.drawImage(arka, 0, 0, gen, yuk);

    // Yazıt
    ekran.drawImage(yazitKat, 0, 0, gen, yuk);

    kazimaAdim(dt);
    if (isci.aktif) isciCiz(ekran);

    // Kuşlar
    if (kusAcik && zaman - sonKus > 9000) { sonKus = zaman; kusSurusu(Math.round(rast(5, 9))); }
    for (var i = kuslar.length - 1; i >= 0; i--) {
      var k = kuslar[i];
      k.x += k.hiz * dt * 60;
      k.y += Math.sin(zaman / 2400 + k.faz) * 0.12;
      if (k.x > gen + 60) { kuslar.splice(i, 1); continue; }
      kusCiz(ekran, k, zaman);
    }

    // Uçurtmalar
    if (ucurtmaAcik && zaman - sonUcurtma > 2200 && ucurtmalar.length < 5) { sonUcurtma = zaman; ucurtmaSal(); }
    for (i = ucurtmalar.length - 1; i >= 0; i--) {
      var u = ucurtmalar[i];
      if (u.y > u.hedefY) u.y -= u.hiz * dt * 60;
      else u.y = u.hedefY + Math.sin(zaman / 1500 + u.faz) * 8;
      ucurtmaCiz(ekran, u, zaman);
    }

    // Uçuşan yapraklar
    if (yaprakAcik && yapraklar.length < 34 && Math.random() < 0.08) yaprakSal();
    for (i = yapraklar.length - 1; i >= 0; i--) {
      var y2 = yapraklar[i];
      y2.y += y2.hiz * dt * 60;
      y2.x += (Math.sin(zaman / 900 + y2.faz) * 0.9 + y2.surukle) * dt * 60;
      y2.donme += y2.donHiz;
      if (y2.y > yuk + 20 || y2.x > gen + 20) { yapraklar.splice(i, 1); continue; }
      ekran.save();
      ekran.translate(y2.x, y2.y); ekran.rotate(y2.donme);
      ekran.fillStyle = 'rgba(' + y2.renk + ', 0.9)';
      ekran.beginPath();
      ekran.ellipse(0, 0, y2.r, y2.r * (0.45 + 0.3 * Math.abs(Math.cos(y2.donme))), 0, 0, 6.283);
      ekran.fill();
      ekran.restore();
    }

    // Toz ve kıymık
    for (i = parcalar.length - 1; i >= 0; i--) {
      var p = parcalar[i];
      p.px = p.x; p.py = p.y;
      p.x += p.vx; p.y += p.vy;
      p.vy += p.yer; p.vx *= 0.985; p.vy *= 0.985;
      p.omur -= p.sonme;
      if (p.omur <= 0) { parcalar.splice(i, 1); continue; }
      var a = Math.max(0, p.omur);
      if (p.duman) {
        ekran.fillStyle = 'rgba(' + p.renk + ', ' + (a * 0.3).toFixed(3) + ')';
        ekran.beginPath(); ekran.arc(p.x, p.y, p.r * (2.4 - a), 0, 6.283); ekran.fill();
      } else {
        ekran.fillStyle = 'rgba(' + p.renk + ', ' + (a * 0.9).toFixed(3) + ')';
        ekran.beginPath(); ekran.arc(p.x, p.y, p.r, 0, 6.283); ekran.fill();
      }
    }

    requestAnimationFrame(kare);
  }

  // ---------- Akış ----------
  var zamanlayici = [];
  function sonra(saniye, is) { zamanlayici.push(setTimeout(is, saniye * 1000)); }
  function altyazi(metin) {
    var el = sec('altyazi');
    el.classList.remove('gorunur');
    if (!metin) return;
    zamanlayici.push(setTimeout(function () { el.textContent = metin; el.classList.add('gorunur'); }, 700));
  }

  function filmBaslat() {
    zamanlayici.forEach(clearTimeout); zamanlayici = [];
    parcalar = []; kuslar = []; ucurtmalar = []; yapraklar = [];
    ucurtmaAcik = false; yaprakAcik = false; kazimaAcik = false;
    isci.aktif = false; isci.cantaKondu = false;
    glifler.forEach(function (g) { g.kazili = false; });
    yazitCtx.clearRect(0, 0, gen, yuk);
    kaziliSayi = 0;
    sec('giris').hidden = true;
    sec('kapanis').hidden = true;
    sec('altyazi').classList.remove('gorunur');
    kusAcik = true; sonKus = performance.now() - 6000;
    kusSurusu(6);

    if (azHareket) {
      glifler.forEach(glifKaz);
      kaziliSayi = glifler.length;
      bitir();
      return;
    }

    sonra(0.6, function () { altyazi('Sabah güneşi dağın tepesine yeni vurmuştu.'); });
    sonra(4.4, function () { altyazi('Biri patikadan yukarı çıktı.'); });
    sonra(7.6, function () { altyazi('Çantasında çekici ve mıhı var.'); isci.aktif = true; kazimaBaslat(); });
    sonra(11.5, function () { altyazi('Kayaya bir isim kazıyor.'); });
    sonra(16, function () { altyazi(''); });
  }

  function bitir() {
    // İşçi yazıyı kapatmasın: eserine bakmak için kenara çekilir
    isci.bakis = -1; isci.vuruyor = false; isci.faz = 0;
    isci.x = gen * 0.88; isci.y = yuk * 0.95;
    isci.hedefX = isci.x; isci.hedefY = isci.y;
    isci.cantaX = isci.x + isci.boy * 0.85; isci.cantaY = isci.y;
    sec('kapanis').hidden = false;
    altyazi('');
    yaprakAcik = true;
    if (azHareket) return;
    ucurtmaAcik = true;
    ucurtmaSal();
    sonra(0.5, kusSurusu);
    sonra(0.4, function () { ezgiCal(0); });
    for (var i = 0; i < 10; i++) sonra(rast(0.5, 9), function () { kusOtmesi(0); });
  }

  window.addEventListener('resize', function () { boyutla(); });
  boyutla();
  requestAnimationFrame(kare);

  function basla() {
    sesHazirla();
    var yaziHazir = document.fonts && document.fonts.load
      ? Promise.all([document.fonts.load('700 100px Cinzel'), document.fonts.load('600 16px Manrope')])
      : Promise.resolve();
    var basladi = false, git = function () {
      if (basladi) return;
      basladi = true;
      olcuHesapla(); yazitYerlesim(); arkaPlanCiz(); yazitKatHazirla();
      filmBaslat();
    };
    yaziHazir.then(git, git);
    setTimeout(git, 1800);
  }
  sec('basla').addEventListener('click', basla);
  sec('tekrar').addEventListener('click', function () { sesHazirla(); filmBaslat(); });
})();
</script>
